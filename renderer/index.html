<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="pi-plugin-panel-chrome" content="safe-area-v1" />
  <title>大日志文件查看器</title>
  <style>
    :root {
      --pi-titlebar: var(--pi-plugin-titlebar-height, 46px);
      --row-h: 20px;
      --log-font: "Cascadia Mono", Consolas, "SF Mono", Menlo, "Courier New", monospace;
    }
    :root[data-theme="dark"] {
      --bg: #15171c;
      --bg2: #1c1f26;
      --bg3: #242832;
      --border: #2c313d;
      --text: #d6dae2;
      --text-dim: #8a919e;
      --accent: #2fb5a0;
      --accent-dim: rgba(47, 181, 160, 0.16);
      --error: #e5615c;
      --warn: #e0a03c;
      --info: #5b9bd5;
      --debug: #8a919e;
      --hl: #7a5d10;
      --hl-text: #ffe9a8;
      --current-bg: rgba(47, 181, 160, 0.12);
      --sel-row: rgba(255, 255, 255, 0.045);
      --lv-error-bg: rgba(175, 48, 48, 0.24);
      --lv-error-hover: rgba(196, 65, 65, 0.34);
      --lv-error-fg: #ffaaa5;
      --lv-warn-bg: rgba(177, 123, 30, 0.24);
      --lv-warn-hover: rgba(205, 151, 44, 0.34);
      --lv-warn-fg: #f6c66f;
      --lv-info-bg: rgba(53, 111, 166, 0.24);
      --lv-info-hover: rgba(70, 132, 193, 0.34);
      --lv-info-fg: #9fc8f1;
      --lv-debug-bg: rgba(126, 134, 147, 0.18);
      --lv-debug-hover: rgba(150, 158, 171, 0.28);
      --lv-debug-fg: #b8bec8;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --bg2: #f4f5f7;
      --bg3: #ebecef;
      --border: #dcdfe4;
      --text: #24282f;
      --text-dim: #7a828e;
      --accent: #0e9280;
      --accent-dim: rgba(14, 146, 128, 0.12);
      --error: #c7413c;
      --warn: #b07514;
      --info: #2c6fad;
      --debug: #7a828e;
      --hl: #ffe9a8;
      --hl-text: #5c4400;
      --current-bg: rgba(14, 146, 128, 0.12);
      --sel-row: rgba(0, 0, 0, 0.04);
      --lv-error-bg: #fde8e7;
      --lv-error-hover: #f9d7d5;
      --lv-error-fg: #9e2925;
      --lv-warn-bg: #fff4d6;
      --lv-warn-hover: #ffebbd;
      --lv-warn-fg: #75500b;
      --lv-info-bg: #e6f1fc;
      --lv-info-hover: #d5e8fa;
      --lv-info-fg: #1e568e;
      --lv-debug-bg: #f0f1f3;
      --lv-debug-hover: #e6e8eb;
      --lv-debug-fg: #525b68;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      height: calc(100dvh - var(--pi-titlebar));
      padding-top: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    button, select, input { font: inherit; color: inherit; }
    button {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--bg3); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { filter: brightness(1.08); }
    button.toggled { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.45; cursor: default; }
    input[type="text"], input[type="search"] {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 8px;
      outline: none;
      user-select: text;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="checkbox"] { accent-color: var(--accent); }

    /* tabs */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 0;
      min-height: 38px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      flex: 0 1 auto;
      max-width: calc(100% - 120px);
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg2);
      cursor: pointer;
      max-width: 240px;
      flex: 0 0 auto;
    }
    .tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
    .tab .t-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tab .t-close {
      border: 0; background: none; padding: 0 3px; border-radius: 4px;
      color: var(--text-dim); font-size: 12px; line-height: 1;
    }
    .tab .t-close:hover { color: var(--error); background: none; }
    .spacer { flex: 1; }

    /* toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .toolbar::-webkit-scrollbar { display: none; }
    .toolbar .sep { width: 1px; height: 20px; background: var(--border); flex: 0 0 auto; }

    /* file bar */
    .filebar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 12px;
      border-bottom: 1px solid var(--border);
      min-height: 32px;
      font-size: 12px;
    }
    .filebar .f-name {
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 40%;
    }
    .filebar .f-meta { color: var(--text-dim); white-space: nowrap; }
    .badges { display: flex; gap: 6px; margin-left: auto; }
    .badge {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 1px 9px;
      cursor: pointer;
      font-size: 11px;
      background: var(--bg2);
      white-space: nowrap;
    }
    .badge b { font-weight: 600; }
    .badge.lv-error b { color: var(--error); }
    .badge.lv-warn b { color: var(--warn); }
    .badge.lv-info b { color: var(--info); }
    .badge.lv-debug b { color: var(--debug); }
    .badge.on { background: var(--accent-dim); border-color: var(--accent); }
    .badge.on::after { content: " +"; color: var(--accent); }
    .badge.exclude { background: transparent; border-color: var(--error); color: var(--error); }
    .badge.exclude::after { content: " −"; color: var(--error); }
    .idx-progress { color: var(--text-dim); font-size: 11px; white-space: nowrap; }

    /* search bar */
    .searchbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg2);
    }
    .searchbar input[type="text"] { flex: 0 1 360px; }
    .searchbar label { display: inline-flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 12px; cursor: pointer; }
    .search-state { color: var(--text-dim); font-size: 12px; white-space: nowrap; }
    .search-state b { color: var(--accent); }

    /* log view */
    .view-wrap { position: relative; flex: 1; min-height: 0; }
    #scroller {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: auto;
      cursor: default;
    }
    #spacer { position: relative; width: max-content; min-width: 100%; }
    .row {
      position: absolute;
      left: 0;
      right: auto;
      height: var(--row-h);
      display: flex;
      align-items: center;
      font-family: var(--log-font);
      font-size: var(--row-fs, 12px);
      line-height: var(--row-h);
      white-space: pre;
      color: var(--row-fg, var(--text));
      background: var(--row-bg, transparent);
    }
    .row:hover { background: var(--row-hover, var(--sel-row)); }
    .row:hover .lno { background: var(--row-hover, var(--sel-row)); }
    .row.current { background: var(--row-bg, var(--current-bg)); box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1px var(--accent); }
    .lno {
      position: sticky;
      left: 0;
      flex: 0 0 auto;
      min-width: 64px;
      padding: 0 8px;
      text-align: right;
      color: var(--text-dim);
      background: var(--row-bg, var(--bg));
      border-right: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      z-index: 2;
    }
    .lno:hover { color: var(--accent); }
    .ltxt { padding: 0 12px; user-select: text; cursor: text; }
    .ltxt mark { background: var(--hl); color: var(--hl-text); border-radius: 2px; padding: 0 1px; }
    .row.lv-error { --row-bg: var(--lv-error-bg); --row-hover: var(--lv-error-hover); --row-fg: var(--lv-error-fg); }
    .row.lv-warn { --row-bg: var(--lv-warn-bg); --row-hover: var(--lv-warn-hover); --row-fg: var(--lv-warn-fg); }
    .row.lv-info { --row-bg: var(--lv-info-bg); --row-hover: var(--lv-info-hover); --row-fg: var(--lv-info-fg); }
    .row.lv-debug { --row-bg: var(--lv-debug-bg); --row-hover: var(--lv-debug-hover); --row-fg: var(--lv-debug-fg); }

    #jumpChip {
      position: absolute;
      right: 18px;
      bottom: 14px;
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      z-index: 5;
    }
    #dropMask {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--accent-dim);
      border: 2px dashed var(--accent);
      color: var(--accent);
      font-size: 16px;
      z-index: 6;
      pointer-events: none;
    }
    #emptyState {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--text-dim);
    }
    #emptyState button { padding: 8px 20px; }

    /* status bar */
    .statusbar {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding: 3px 12px;
      font-size: 11px;
      color: var(--text-dim);
      min-height: 26px;
    }
    .statusbar select {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 11px;
    }
    .follow-state.on { color: var(--accent); }
    .follow-state.paused { color: var(--warn); }

    /* modals & menus */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .overlay.show { display: flex; }
    .sheet {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: min(680px, 86vw);
      max-height: 78vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    }
    .sheet-head {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }
    .sheet-head .x { margin-left: auto; border: 0; background: none; color: var(--text-dim); cursor: pointer; font-size: 15px; }
    .crumb { padding: 8px 16px; color: var(--accent); cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--border); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-list { flex: 1; overflow: auto; padding: 6px 8px; }
    .f-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12.5px;
    }
    .f-row:hover { background: var(--bg3); }
    .f-row .f-size, .f-row .f-time { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
    .f-row .f-size { margin-left: auto; }
    .sheet-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
    }
    .menu {
      position: fixed;
      display: none;
      flex-direction: column;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      min-width: 180px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      z-index: 30;
    }
    .menu.show { display: flex; }
    .menu button { border: 0; background: none; text-align: left; padding: 7px 12px; border-radius: 6px; }
    .menu button:hover:not(:disabled) { background: var(--bg3); }
    #toast {
      position: fixed;
      right: 16px;
      bottom: 40px;
      background: var(--bg3);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.18s ease;
      pointer-events: none;
      max-width: 60vw;
      z-index: 40;
    }
    #toast.show { opacity: 1; transform: none; }
  </style>
</head>
<body>
  <div class="tabs-bar">
    <div class="tabs" id="tabs"></div>
    <div class="spacer"></div>
    <button id="btnAdd" title="打开文件">＋</button>
  </div>

  <div class="toolbar">
    <button id="btnOpenDir">打开文件</button>
    <button id="btnHead">头部</button>
    <button id="btnTail">尾部</button>
    <button id="btnJumpLine">跳转行</button>
    <button id="btnFollow">实时跟随</button>
    <div class="sep"></div>
    <button id="btnFontDown" title="减小字号">A-</button>
    <button id="btnFontUp" title="增大字号">A+</button>
    <select id="fontFamilySel" title="日志字体">
      <option value="default">等宽字体（系统）</option>
      <option value="Consolas, monospace">Consolas</option>
      <option value='"Cascadia Mono", monospace'>Cascadia Mono</option>
      <option value='"SF Mono", Menlo, monospace'>SF Mono / Menlo</option>
      <option value='"JetBrains Mono", monospace'>JetBrains Mono</option>
      <option value='"Fira Code", monospace'>Fira Code</option>
    </select>
    <button id="btnTheme" title="切换主题">🌗</button>
  </div>

  <div class="filebar" id="filebar" style="display:none">
    <span class="f-name" id="fName"></span>
    <span class="f-meta" id="fMeta"></span>
    <span class="idx-progress" id="idxProgress"></span>
    <div class="badges" id="badges">
      <span class="badge lv-error" data-level="error">ERROR <b>0</b></span>
      <span class="badge lv-warn" data-level="warn">WARN <b>0</b></span>
      <span class="badge lv-info" data-level="info">INFO <b>0</b></span>
      <span class="badge lv-debug" data-level="debug">DEBUG <b>0</b></span>
    </div>
  </div>

  <div class="searchbar" id="searchbar">
    <input type="text" id="searchInput" placeholder="全文搜索关键字或正则（Ctrl+F / F3 下一处）" />
    <label><input type="checkbox" id="cbRegex" /> 正则</label>
    <label><input type="checkbox" id="cbCase" /> 区分大小写</label>
    <button id="btnSearch" class="primary">搜索全文</button>
    <button id="btnPrevMatch" title="上一个命中（Shift+F3）">↑</button>
    <button id="btnNextMatch" title="下一个命中（F3）">↓</button>
    <span class="search-state" id="searchState"></span>
    <div class="spacer"></div>
    <button id="btnSearchClose" title="清除搜索">✕</button>
  </div>

  <div class="view-wrap">
    <div id="scroller">
      <div id="spacer"></div>
    </div>
    <div id="emptyState">
      <div>打开日志文件开始查看</div>
      <button id="btnEmptyOpen" class="primary">打开文件</button>
      <div style="font-size:12px">或将 .log / .txt 文件拖入本窗口</div>
    </div>
    <div id="jumpChip">↓ 有新日志，点击回到底部</div>
    <div id="dropMask">松开以打开拖入的日志文件</div>
  </div>

  <div class="statusbar">
    <span id="stPos">—</span>
    <span id="stLines"></span>
    <span id="stSize"></span>
    <span class="follow-state" id="stFollow"></span>
    <div class="spacer"></div>
    <select id="encodingSel" title="编码">
      <option value="utf-8">UTF-8</option>
      <option value="gbk">GBK</option>
      <option value="gb18030">GB18030</option>
    </select>
  </div>

  <div class="overlay" id="dirOverlay">
    <div class="sheet">
      <div class="sheet-head">选择日志文件<span class="x" id="dirClose">✕</span></div>
      <div class="crumb" id="dirPath" style="cursor:default"></div>
      <div class="file-list" id="fileList"></div>
      <div class="sheet-foot">
        <span style="color:var(--text-dim);font-size:12px" id="dirSelInfo">未选择</span>
        <div class="spacer"></div>
        <button id="dirCancel">取消</button>
        <button id="dirOpen" class="primary" disabled>打开选中</button>
      </div>
    </div>
  </div>

  <div class="menu" id="ctxMenu">
    <button id="ctxCopyLine">复制整行</button>
    <button id="ctxCopySel">复制选中内容</button>
  </div>
  <div id="toast"></div>

  <script src="level.js"></script>
  <script src="query.js"></script>
  <script src="app.js"></script>
</body>
</html>
